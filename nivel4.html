<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nivel 4</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .chat { text-align: left; margin-top: 15px; }
    .msg { background: rgba(255,255,255,0.1); padding: 10px; border-radius: 10px; margin: 5px 0; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Nivel 4: Conversación sospechosa</h2>
    <div id="chat" class="chat"></div>
    <button id="continuar">Continuar</button>
  </div>

  <script>
const mensajes = [
  "Desconocido: Que onda? Creo que te vi en un grupo o algo así 😅",
  "Vos: Mmm no me suena tu cara, ¿quién sos?",
  "Desconocido: Jajaja, capaz me confundo 😅 igual parecés re buena onda",
  "Vos: Ah gracias... ¿de dónde sos?",
  "Desconocido: Cerca tuyo, creo 😏 ¿vas a la 47?",
  "Vos: Sí, ¿cómo sabés eso?",
  "Desconocido: Tengo amigos ahí, me mostraron tu perfil xd",
  "Vos: Ok?... jaja",
  "Desconocido: Nah tranqui, sos linda, ¿te paso mi Insta y hablamos ahí?.",
  "Vos: que....",
  "Desconocido: so xdXDxdDX.",
  "Vos:Prefiero dejarlo acá, no te conozco mucho.",
  "Desconocido: Dalee, no seas así 😅 pasame una foto tuya mejor.",
  "Vos: No, esto no me da confianza. Voy a bloquearte."
];

    let i = 0;
    const chat = document.getElementById('chat');
    const btn = document.getElementById('continuar');

    btn.onclick = () => {
      if (i < mensajes.length) {
        const msg = document.createElement('p');
        msg.classList.add('msg');
        msg.textContent = mensajes[i];
        chat.appendChild(msg);

        // Si acabamos de mostrar el último mensaje...
        if (i === mensajes.length - 1) {
          btn.textContent = "Avisar a un adulto";
          btn.onclick = () => {
            alert("¡Bien hecho! Siempre cuéntales a adultos de confianza cuando alguien te haga sentir incómodo o pida cosas privadas.");
            window.location.href = 'nivel5.html';
          };
        }
        i++;
      }
    };
  </script>
</body>
</html>
