<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>Nivel 4 – Conversación peligrosa</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');
    :root{
      --bg:#0d0d10;
      --neon:#9d4edd;
      --accent:#ff0055;
      --ok:#4ef04e;
      --bad:#ff4e4e;
      --chat:rgba(255,255,255,.08);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'Poppins',sans-serif;
      background:url('fondo.png.png') no-repeat center center/cover;
      color:#eee;
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      backdrop-filter:blur(6px) brightness(.3);
      -webkit-user-select:none;user-select:none;
    }
    .container{
      background:rgba(0,0,0,.65);
      border:1px solid rgba(255,255,255,.2);
      border-radius:15px;
      padding:15px;
      width:92vw;
      max-width:360px;
      height:82vh;
      display:flex;
      flex-direction:column;
    }
    h2{font-size:1.25em;margin-bottom:.4em;letter-spacing:1px}
    #cronito{font-size:.9em;margin-bottom:.6em;color:var(--accent)}
    #chatBox{
      flex:1;
      overflow-y:auto;
      padding:8px;
      background:var(--chat);
      border-radius:10px;
      display:flex;
      flex-direction:column;
      gap:8px;
      font-size:.95em;
    }
    .msg{
      padding:8px 12px;
      border-radius:12px;
      max-width:78%;
      word-break:break-word;
    }
    .el{
      align-self:flex-start;
      background:rgba(255,255,255,.12);
    }
    .yo{
      align-self:flex-end;
      background:var(--neon);
      color:#000;
    }
    #opciones{
      margin-top:10px;
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .opt{
      padding:10px;
      background:rgba(255,255,255,.1);
      border:1px solid rgba(255,255,255,.2);
      border-radius:8px;
      cursor:pointer;
      transition:.25s;
    }
    .opt:hover{background:rgba(255,255,255,.2)}
    #overlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.75);
      display:none;
      align-items:center;
      justify-content:center;
      text-align:center;
      z-index:999;
    }
    .final-box{
      background:var(--bg);
      border:2px solid var(--accent);
      border-radius:12px;
      padding:25px 20px;
      width:80vw;
      max-width:300px;
    }
    .final-box h3{margin-bottom:10px;font-size:1.3em}
    .final-box button{
      margin-top:15px;padding:8px 18px;background:#222;color:#fff;
      border:1px solid rgba(255,255,255,.2);border-radius:8px;cursor:pointer
    }
  </style>
</head>
<body>

<div class="container">
  <h2>💬 Nivel 4 – Conversación peligrosa</h2>
  <p id="cronito">Elige sabiamente...</p>

  <div id="chatBox"></div>
  <div id="opciones"></div>
</div>

<div id="overlay">
  <div class="final-box">
    <h3 id="finalTit"></h3>
    <p id="finalTxt"></p>
    <button id="btnFinal">Continuar</button>
  </div>
</div>

<script>
  /* ----------  ÁRBOL DE CONVERSACIÓN  ---------- */
  const arbol = {
    start:{
      mensajes:[
        {tipo:"el",texto:"Desconocido: que onda, te vi en insta y estas re linda 😏"},
        {tipo:"el",texto:"¿Me pasas tu número para hablar por Whats?"},
        {tipo:"el",texto:"jugamos a algo...?"}
      ],
      opciones:[
        {texto:"a) jaja dale, acá va...",siguiente:"mal1"},
        {texto:"b) No doy mi número a desconocidos",siguiente:"neutro1"},
        {texto:"c) Voy a avisar a un adulto",siguiente:"bien1"}
      ]
    },
    mal1:{
      mensajes:[
        {tipo:"yo",texto:"+54 11 1234-5678"},
        {tipo:"el",texto:"Gracias linda 😘, después te escribo"},
        {tipo:"el",texto:"Mandame una foto tuya ahora 😉"}
      ],
      final:"mal"
    },
    neutro1:{
      mensajes:[
        {tipo:"yo",texto:"No doy mi número a desconocidos"},
        {tipo:"el",texto:"Bueno, hablamos por acá entonces miamorr 😉"},
        {tipo:"el",texto:"¿Al menos una foto? No seas mala onda"}
      ],
      final:"neutro"
    },
    bien1:{
      mensajes:[
        {tipo:"yo",texto:"Lo voy a comentar con un adulto"},
        {tipo:"el",texto:"anda ortiva."}
      ],
      final:"bien"
    }
  };

  const chatBox   = document.getElementById('chatBox');
  const opciones  = document.getElementById('opciones');
  let nodoActual  = "start";
  let finalTipo   = null;

  /* ----------  IMPRIMIR MENSAJES (1 s entre ellos)  ---------- */
  function escribir(mensajes,onEnd){
    let i=0;
    function loop(){
      if(i>=mensajes.length)return setTimeout(onEnd,1000); // extra segundo antes de opciones/botón
      const m=mensajes[i];
      const div=document.createElement('div');
      div.className='msg '+m.tipo;
      div.textContent=m.texto;
      chatBox.appendChild(div);
      chatBox.scrollTop=chatBox.scrollHeight;
      i++;
      setTimeout(loop,1000);
    }
    loop();
  }

  /* ----------  MOSTRAR OPCIONES  ---------- */
  function mostrarOpciones(ops){
    opciones.innerHTML='';
    ops.forEach(o=>{
      const b=document.createElement('div');
      b.className='opt';
      b.textContent=o.texto;
      b.onclick=()=>irA(o.siguiente);
      opciones.appendChild(b);
    });
  }

  /* ----------  IR A NODO  ---------- */
  function irA(id){
    opciones.innerHTML='';
    const nodo=arbol[id];
    escribir(nodo.mensajes,()=>{
      if(nodo.final)return mostrarFinal(nodo.final);
      mostrarOpciones(nodo.opciones);
    });
  }

  /* ----------  MOSTRAR FINAL  ---------- */
  function mostrarFinal(tipo){
    finalTipo=tipo;
    const tit=document.getElementById('finalTit');
    const txt=document.getElementById('finalTxt');
    const overlay=document.getElementById('overlay');
    overlay.style.display='flex';

    switch(tipo){
      case "mal":
        tit.textContent="❌ Fin malo";
        txt.textContent="Compartiste datos. sos pollo.";
        break;
      case "neutro":
        tit.textContent="⚠️  Fin neutro";
        txt.textContent="No pasaste datos, pero tampoco avisaste. La próxima cuéntalo.";
        break;
      case "bien":
        tit.textContent="✅ Fin bueno";
        txt.textContent="¡Bloqueaste y avisaste! como se debe craackkk.";
        break;
    }
  }

  /* ----------  BOTÓN FINAL  ---------- */
  document.getElementById('btnFinal').onclick=()=>{
    if(finalTipo==='bien'){
      window.location.href='nivel5.html';
    }else{
      location.reload(); // reinicia para reintentar
    }
  };

  /* ----------  INICIAR  ---------- */
  escribir(arbol.start.mensajes,()=>mostrarOpciones(arbol.start.opciones));
</script>
</body>
</html>
