<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nivel 1 – completa la palabra</title>
<link rel="stylesheet" href="style.css">
<style>
  body {
    background: url('fondo.png.png') no-repeat center center fixed;
    background-size: cover;
    color: #eee;
    font-family: 'Poppins', sans-serif;
    text-align: center;
    height: 100vh;
    margin: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    backdrop-filter: blur(6px) brightness(0.3);
  }

  .container {
    background: rgba(0, 0, 0, 0.6);
    border-radius: 20px;
    padding: 25px;
    width: 90%;
    max-width: 420px;
    box-shadow: 0 0 15px rgba(255,255,255,0.1);
  }

  h2 {
    font-size: 1.4em;
    margin-bottom: 15px;
    color: #fff;
  }

  p {
    color: #ccc;
    font-size: 1em;
  }

  .option {
    display: block;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    color: #eee;
    margin: 8px 0;
    padding: 10px;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.3s;
  }

  .option:hover {
    background: rgba(255,255,255,0.2);
  }

  #feedback {
    margin-top: 15px;
    font-weight: bold;
  }

  button {
    margin-top: 15px;
    background-color: #222;
    color: #fff;
    border: 1px solid rgba(255,255,255,0.2);
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.3s;
  }

  button:hover {
    background-color: #444;
  }
</style>
</head>
<body>
  <div class="container">
    <h2>🧩 Nivel 1 – “gracias por participar”</h2>
    <p>Completá la frase correctamente:</p>
    <p><strong>“No compartas tu ______ personal.”</strong></p>

    <div id="opciones">
      <div class="option" onclick="respuesta(1)">a) comida</div>
      <div class="option" onclick="respuesta(2)">b) información</div>
      <div class="option" onclick="respuesta(3)">c) contraseña</div>
    </div>

    <p id="feedback"></p>
    <button id="continuar" style="display:none;" onclick="siguienteNivel()">Continuar</button>
  </div>

<script>
function respuesta(opcion) {
  const feedback = document.getElementById("feedback");
  const continuar = document.getElementById("continuar");

  if (opcion === 2) {
    feedback.style.color = "#4ef04e";
    feedback.textContent = "✅ Correcto. Nunca compartas tu información personal en línea.";
    continuar.style.display = "inline-block";
  } else {
    feedback.style.color = "#ff4e4e";
    feedback.textContent = "❌ dea que tiraba. Pensá bien, la información personal es lo más sensible.";
  }
}

function siguienteNivel() {
  window.location.href = "nivel2.html";
}
</script>
</body>
</html>
