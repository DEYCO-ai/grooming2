<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¡Felicidades!</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>¡Felicidades!</h2>
    <p>Completaste todos los niveles del juego 🏆</p>
    <p id="mensaje"></p>
    <h3 id="codigo"></h3>
  </div>

  <script>
    const jugador = JSON.parse(localStorage.getItem('jugador')) || { nombre: 'Jugador', curso: '' };
    const codigo = "SAFE-" + jugador.nombre.toUpperCase().substring(0,3) + "-42";
    document.getElementById('codigo').innerText = "Tu código: " + codigo;

    const scriptURL = "https://script.google.com/macros/s/AKfycbyR4PAifdKUDXzVrzxtlk4WIddAnGZrZg0xx4AcQ1EvLyljob4AzqjnptX2v84fwz57/exec"; // misma URL que en nivel5.html

    async function verificarOrden() {
      try {
        // Obtener datos desde la hoja
        const res = await fetch(scriptURL + "?t=" + Date.now());
        const texto = await res.text();
        // No podemos leer el contenido si está en modo "no-cors", 
        // pero podemos simular un mensaje local:
        const yaJugó = localStorage.getItem('jugadorYaJugó');
        let mensaje;
        if (!yaJugó) {
          mensaje = "¡Parece que fuiste uno de los primeros en completar la actividad!";
          localStorage.setItem('jugadorYaJugó', 'true');
        } else {
          mensaje = "Ya otros completaron la actividad, pero igual lo lograste 💪";
        }
        document.getElementById('mensaje').innerText = mensaje;
      } catch (e) {
        document.getElementById('mensaje').innerText = "¡Lo lograste! (Verifica en la hoja si fuiste el primero)";
      }
    }

    verificarOrden();
  </script>
</body>
</html>
