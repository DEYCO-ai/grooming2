<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>¡Finalizado – 6ROOM1NG!</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');
    :root{
      --bg:#0d0d10;
      --neon:#9d4edd;
      --ok:#4ef04e;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'Poppins',sans-serif;
      background:url('fondo.png.png') no-repeat center center/cover;
      color:#eee;
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      backdrop-filter:blur(6px) brightness(.3);
      -webkit-user-select:none;user-select:none;
    }
    .card{
      background:rgba(0,0,0,.65);
      border:1px solid rgba(255,255,255,.2);
      border-radius:15px;
      padding:30px 20px;
      width:90vw;
      max-width:360px;
      box-shadow:0 0 15px rgba(255,255,255,.1);
    }
    h1{font-size:1.8em;margin-bottom:.5em;letter-spacing:1px;color:var(--ok)}
    p{margin-bottom:1em;font-size:.95em;line-height:1.4}
    .sello{
      width:120px;
      height:120px;
      margin:15px auto;
      border-radius:12px;
      overflow:hidden;
      border:2px solid var(--neon);
      box-shadow:0 0 10px var(--neon);
    }
    .sello img{width:100%;height:100%;object-fit:cover}
    button{
      margin-top:15px;padding:10px 25px;background:#222;color:#fff;
      border:1px solid rgba(255,255,255,.2);border-radius:8px;font-size:1em;cursor:pointer
    }
    button:hover{background:#444}
  </style>
</head>
<body>

<div class="card">
  <h1>¡Felicitaciones!</h1>
  <p>Has completado <strong>6ROOM1NG</strong>. Gracias por participar.</p>
  
  <div class="sello">
    <img src="fondo.png.png" alt="Sello visual"/>
  </div>

  <p><strong>Muestra esta pantalla para obtener tu premio.</strong></p>

  <button onclick="window.location.href='index.html'">Volver al inicio</button>
</div>

</body>
</html>
