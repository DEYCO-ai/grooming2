<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>6ROOM1NG – Inicio</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');
    :root{
      --bg:#0d0d10;
      --neon:#9d4edd;
      --accent:#ff0055;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'Poppins',sans-serif;
      background:url('fondo.png.png') no-repeat center center/cover;
      color:#eee;
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      backdrop-filter:blur(6px) brightness(.3);
      -webkit-user-select:none;user-select:none;
    }
    .card{
      background:rgba(0,0,0,.65);
      border:1px solid rgba(255,255,255,.2);
      border-radius:15px;
      padding:25px 20px;
      width:90vw;
      max-width:360px;
      box-shadow:0 0 15px rgba(255,255,255,.1);
    }
    h1{font-size:1.8em;margin-bottom:.5em;letter-spacing:1px;color:var(--neon)}
    p{margin-bottom:1em;font-size:.95em;line-height:1.4}
    button{
      padding:10px 25px;
      background:#222;
      color:#fff;
      border:1px solid rgba(255,255,255,.2);
      border-radius:8px;
      font-size:1em;
      cursor:pointer;
      transition:.3s;
    }
    button:hover{background:#444}
    .integrantes{
      position:absolute;
      bottom:10px;
      right:12px;
      font-size:.7em;
      opacity:.6;
      text-align:right;
      line-height:1.3;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>6ROOM1NG</h1>
  <p>
    Pequeña experiencia interactiva sobre grooming digital.<br>
    <strong>Advertencia:</strong> puede contener lenguaje vulgar o situaciones incómodas.
  </p>
  <p style="font-size:.8em;opacity:.7;">
    Este es mi primer código: simple, con errores y mucho aprendizaje.
  </p>

  <button onclick="window.location.href='nivel1.html'">Continuar</button>
</div>

<div class="integrantes">
  Integrantes:<br>
  Ludmila Mostracio<br>
  Ruiz Iara<br>
  Rosa Zamora<br>
  Dylan Saavedra<br>
  Tobias Roldán
</div>

</body>
</html>
