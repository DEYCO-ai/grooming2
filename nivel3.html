<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nivel 3 – Ordena y descubre</title>
  <style>
    /* ----------  MISMOS ESTILOS BASE  ---------- */
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

    body{
      font-family:'Poppins',sans-serif;
      background:url('fondo.png.png') no-repeat center center fixed;
      background-size:cover;
      color:#eee;
      height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      backdrop-filter:blur(6px) brightness(0.3);
    }
    .container{
      background:rgba(0,0,0,.6);
      border:1px solid rgba(255,255,255,.2);
      border-radius:15px;
      padding:25px 20px;
      width:90%;
      max-width:400px;
      box-shadow:0 0 15px rgba(255,255,255,.1);
    }
    h2{
      font-size:1.3em;
      margin-bottom:15px;
      letter-spacing:1px;
    }
    #puzzle{
      display:grid;
      grid-template-columns:repeat(4,70px);
      grid-gap:4px;
      margin:15px auto;
      user-select:none;
    }
    .tile{
      width:70px;
      height:70px;
      background-size:280px 280px;
      border-radius:6px;
      cursor:grab;
      transition:transform .2s;
    }
    .tile.dragging{transform:scale(1.08);z-index:10}
    .tile.correct{box-shadow:0 0 10px 2px #4ef04e}

    #inputBox{display:none;margin-top:15px}
    #inputBox input{
      padding:10px 15px;
      font-size:1.1em;
      border:1px solid rgba(255,255,255,.3);
      background:transparent;
      color:#eee;
      border-radius:8px;
      outline:none;
    }
    #inputBox button{
      margin-left:8px;
      padding:10px 18px;
      background:#222;
      color:#fff;
      border:1px solid rgba(255,255,255,.2);
      border-radius:8px;
      cursor:pointer;
      transition:.3s;
    }
    #inputBox button:hover{background:#444}

    #msg{height:1.5em;margin-top:10px;font-weight:600}
  </style>
</head>
<body>

<div class="container">
  <h2>🔍 Nivel 3 – Ordena la imagen</h2>
  <p>Arrastra las piezas hasta formar el emoji correcto.</p>

  <div id="puzzle"></div>

  <div id="inputBox">
    <p>¿Qué palabra se forma?</p>
    <input id="palabra" maxlength="5" placeholder="5 letras"/>
    <button onclick="comprobar()">Enviar</button>
  </div>

  <p id="msg"></p>
</div>

<script>
  /* ----------  CONFIG  ---------- */
  const SOLUCIÓN = "GROOM";
  const TAM    = 4;
  const TILES  = TAM*TAM;
  const EMOJI  = "👁️‍🗨️";

  /* ----------  CREAR PIEZAS  ---------- */
  const puzzle = document.getElementById('puzzle');
  let indices  = Array.from({length:TILES},(_,i)=>i);
  indices.sort(()=>Math.random()-.5);

  indices.forEach((real,i)=>{
    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.draggable = true;
    tile.dataset.real = real;
    const row = Math.floor(real/TAM);
    const col = real%TAM;
    tile.style.backgroundImage = `url('data:image/svg+xml,\
      <svg xmlns="http://www.w3.org/2000/svg" width="280" height="280">\
      <text x="50%" y="50%" font-size="240" fill="white" text-anchor="middle" dominant-baseline="central">${EMOJI}</text></svg>')`;
    tile.style.backgroundPosition = `-${col*70}px -${row*70}px`;
    puzzle.appendChild(tile);
  });

  /* ----------  DRAG & DROP  ---------- */
  let dragged = null;
  puzzle.addEventListener('dragstart',e=>{
    dragged = e.target;
    e.target.classList.add('dragging');
  });
  puzzle.addEventListener('dragend',e=>e.target.classList.remove('dragging'));
  puzzle.addEventListener('dragover',e=>e.preventDefault());
  puzzle.addEventListener('drop',e=>{
    e.preventDefault();
    if(e.target.classList.contains('tile') && e.target!==dragged){
      const all = [...puzzle.children];
      const i1 = all.indexOf(dragged);
      const i2 = all.indexOf(e.target);
      i1<i2 ? e.target.after(dragged) : e.target.before(dragged);
      verificar();
    }
  });

  /* ----------  VERIFICAR ORDEN  ---------- */
  function verificar(){
    const actuales = [...puzzle.children].map(t=>parseInt(t.dataset.real));
    const ok = actuales.every((v,i)=>v===i);
    if(ok){
      puzzle.querySelectorAll('.tile').forEach(t=>t.classList.add('correct'));
      setTimeout(()=>document.getElementById('inputBox').style.display='block',500);
    }
  }

  /* ----------  COMPROBAR PALABRA  ---------- */
  function comprobar(){
    const val = document.getElementById('palabra').value.trim().toUpperCase();
    const msg = document.getElementById('msg');
    if(val===SOLUCIÓN){
      msg.style.color='#4ef04e';
      msg.textContent='¡Correcto! Pasando al siguiente nivel...';
      setTimeout(()=>window.location.href='nivel4.html',1200);
    }else{
      msg.style.color='#ff4e4e';
      msg.textContent='Palabra incorrecta, inténtalo de nuevo.';
    }
  }
</script>
</body>
</html>
